<section class="box profile">
  <h2>Operator: shadey</h2>
  <img class="avatar" src="{{ '/assets/img/avatar.svg' | relative_url }}" alt="Placeholder avatar" width="240" height="240">
  <p class="center small">{{ site.description }}</p>
  <p class="center"><span class="online"><span class="dot"></span>Online</span></p>
  <table class="details">
    <tr><th>Mood</th><td>deploying (recklessly)</td></tr>
    <tr><th>Location</th><td>The homelab</td></tr>
    <tr><th>Rack</th><td>Making heat</td></tr>
    <tr><th>Here for</th><td>Networking</td></tr>
  </table>
  <div class="meters">
    <div class="meter-row"><span>Uptime</span><div class="meter"><i style="width: 99%"></i></div><b>99%</b></div>
    <div class="meter-row"><span>Preworkout</span><div class="meter"><i style="width: 78%"></i></div><b>78%</b></div>
    <div class="meter-row"><span>Rack space</span><div class="meter warn"><i style="width: 12%"></i></div><b>12%</b></div>
  </div>
  <ul class="links">
    <li><a href="{{ '/feed.xml' | relative_url }}">Subscribe to this blog</a></li>
    <li><a href="https://github.com/{{ site.github_username }}">GitHub</a></li>
    <li><a href="{{ '/about/' | relative_url }}">Read my bio</a></li>
  </ul>
</section>
